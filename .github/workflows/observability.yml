name: Daily data observability

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'data/**'
      - 'config/**'
      - 'observability.py'
      - 'docs/index.html'
      - '.github/workflows/observability.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: observability-pages
  cancel-in-progress: false

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check CSVs and build results
        run: python observability.py
      - name: Commit results and bounded history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/results.json docs/history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update observability results"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
